name: Release JJ Plus

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v5

      - name: Install Jujutsu
        uses: taiki-e/install-action@v2
        with:
          tool: jj-cli@0.44.0

      - name: Verify Jujutsu
        run: jj --version

      - name: Set up pnpm
        uses: pnpm/setup@v2
        with:
          install: false
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"

      - name: Check and publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: pnpm release:publish

      - name: Publish CLI package to npm
        if: ${{ secrets.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "jj-plus@${VERSION}" version >/dev/null 2>&1; then
            echo "jj-plus@${VERSION} is already published; skipping."
          else
            pnpm publish --access public --provenance --no-git-checks
          fi
